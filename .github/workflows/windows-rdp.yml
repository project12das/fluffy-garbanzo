name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================
      # 1. Restore previous files
      # =========================================
      - name: Restore Previous Files
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-persistent-files
          path: C:\PersistentFiles

      # =========================================
      # 2. Enable RDP
      # =========================================
      - name: Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

      # =========================================
      # 3. Create Admin Account
      # =========================================
      - name: Create Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force

          New-LocalUser `
            -Name "CynetAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

      # =========================================
      # 4. Install Tailscale
      # =========================================
      - name: Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "============================================"
          Write-Host "        RDP SERVER IS READY"
          Write-Host "============================================"
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : CynetAdmin"
          Write-Host "Password     : Cynet@2026"
          Write-Host "============================================"

      # =========================================
      # 5. Keep RDP alive
      # =========================================
      - name: Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 350; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/350] Server running..."
          }

      # =========================================
      # 6. Save Desktop files
      # =========================================
      - name: Save Persistent Files
        shell: powershell
        run: |
          $SavePath = "C:\PersistentFiles"

          New-Item `
            -ItemType Directory `
            -Path $SavePath `
            -Force | Out-Null

          $Desktop = "C:\Users\runneradmin\Desktop"

          if (Test-Path $Desktop) {
            Copy-Item `
              "$Desktop\*" `
              "$SavePath\" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Persistent files saved."

      # =========================================
      # 7. Upload Artifact
      # =========================================
      - name: Upload Persistent Files
        uses: actions/upload-artifact@v4
        with:
          name: windows-persistent-files
          path: C:\PersistentFiles
          retention-days: 90
          compression-level: 6
          if-no-files-found: warn

      # =========================================
      # 8. Finish
      # =========================================
      - name: Done
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Files uploaded to GitHub Artifact."
          Write-Host "Artifact: windows-persistent-files"
          Write-Host "============================================"
