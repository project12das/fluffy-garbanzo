name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0

      - name: 2. Create Admin Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name 'CynetAdmin' `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member 'CynetAdmin' `
            -ErrorAction SilentlyContinue

      - name: 3. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Installer = 'C:\tailscale.msi'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer

          Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 8

          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          & $Tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname='github-rdp-server'

          Start-Sleep -Seconds 10

          $TS_IP = (& $Tailscale ip -4).Trim()

          Write-Host ''
          Write-Host '============================================' -ForegroundColor Green
          Write-Host '       RDP SERVER IS READY' -ForegroundColor Cyan
          Write-Host '============================================' -ForegroundColor Green
          Write-Host "Tailscale IP : $TS_IP" -ForegroundColor Yellow
          Write-Host 'Username     : CynetAdmin' -ForegroundColor Yellow
          Write-Host 'Password     : value of RDP_PASSWORD secret' -ForegroundColor Yellow
          Write-Host '============================================' -ForegroundColor Green

      - name: 4. Schedule Restart After 6 Hours
        shell: powershell
        run: |
          $TaskName = 'Restart-RDP-After-6-Hours'
          $RestartTime = (Get-Date).AddHours(6)

          $Action = New-ScheduledTaskAction `
            -Execute "$env:SystemRoot\System32\shutdown.exe" `
            -Argument '/r /f /t 60 /d p:0:0 /c "Scheduled restart after 6 hours"'

          $Trigger = New-ScheduledTaskTrigger `
            -Once `
            -At $RestartTime

          Register-ScheduledTask `
            -TaskName $TaskName `
            -Action $Action `
            -Trigger $Trigger `
            -User 'SYSTEM' `
            -RunLevel Highest `
            -Force

          Write-Host "Restart scheduled for: $RestartTime"

      - name: 5. Keep RDP Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] RDP server is running..."
          }
