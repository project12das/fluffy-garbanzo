
name: Windows Cloud RDP

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # =========================================
      # 1. Restore Previous Files
      # =========================================

      - name: Restore Previous Files
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-persistent-files
          path: C:\PersistentFiles

      # =========================================
      # 2. Restore User Data
      # =========================================

      - name: Restore User Data
        shell: powershell
        run: |
          $Source = "C:\PersistentFiles\Profile"
          $Destination = "C:\Users\runneradmin"

          $Folders = @(
            "Desktop",
            "Documents",
            "Downloads"
          )

          foreach ($Folder in $Folders) {
            $From = Join-Path $Source $Folder
            $To = Join-Path $Destination $Folder

            New-Item -ItemType Directory -Path $To -Force |
              Out-Null

            if (Test-Path $From) {
              Copy-Item "$From\*" $To -Recurse -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Previous files restored."

      # =========================================
      # 3. Enable RDP
      # =========================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      # =========================================
      # 4. Create Admin Account
      # =========================================

      - name: Create Admin Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set RDP_PASSWORD in GitHub Secrets."
          }

          $Password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "CynetAdmin" `
            -ErrorAction SilentlyContinue)) {

            New-LocalUser `
              -Name "CynetAdmin" `
              -Password $Password `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

      # =========================================
      # 5. Restore Applications
      # =========================================

      - name: Restore Applications
        shell: powershell
        continue-on-error: true
        run: |
          $Manifest = "C:\PersistentFiles\packages.json"

          if (Test-Path $Manifest) {

            if (Get-Command winget -ErrorAction SilentlyContinue) {

              winget import `
                --import-file $Manifest `
                --ignore-unavailable `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

            } else {
              Write-Host "WinGet is not available."
            }

          } else {
            Write-Host "No previous application manifest."
          }

      # =========================================
      # 6. Install Tailscale
      # =========================================

      - name: Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "Set TAILSCALE_AUTHKEY in GitHub Secrets."
          }

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $IP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "Tailscale IP: $IP"
          Write-Host "Username: CynetAdmin"

      # =========================================
      # 7. Keep Server Alive
      # =========================================

      - name: Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 330; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/330] Server running..."
          }

      # =========================================
      # 8. Prepare Backup
      # =========================================

      - name: Prepare Backup
        if: always()
        shell: powershell
        run: |
          $SavePath = "C:\PersistentFiles"
          $Profile = "$SavePath\Profile"

          New-Item -ItemType Directory `
            -Path $Profile -Force | Out-Null

          $Folders = @(
            "Desktop",
            "Documents",
            "Downloads"
          )

          foreach ($Folder in $Folders) {

            $Source = "C:\Users\runneradmin\$Folder"
            $Target = "$Profile\$Folder"

            New-Item -ItemType Directory `
              -Path $Target -Force | Out-Null

            if (Test-Path $Source) {

              robocopy $Source $Target /E /R:1 /W:1 /NFL /NDL /NJH /NJS

              if ($LASTEXITCODE -ge 8) {
                Write-Warning "Copy issue in $Folder"
              }
            }
          }

          # Export application list
          if (Get-Command winget -ErrorAction SilentlyContinue) {

            winget export `
              --output "$SavePath\packages.json" `
              --include-versions

          }

          if (-not (Test-Path "$SavePath\packages.json")) {
            '{"Sources":[]}' |
              Set-Content "$SavePath\packages.json"
          }

          @{
            SavedAt = (Get-Date).ToUniversalTime().ToString("o")
            Machine = "Windows GitHub Runner"
            Folders = $Folders
          } | ConvertTo-Json -Depth 5 |
            Set-Content "$SavePath\backup-info.json"

          Write-Host "Backup prepared."

      # =========================================
      # 9. Upload Artifact
      # =========================================

      - name: Upload Persistent Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-persistent-files
          path: C:\PersistentFiles
          retention-days: 90
          compression-level: 6
          if-no-files-found: warn
          overwrite: true
