
name: Windows Cloud RDP

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # =========================================
      # 1. Download Previous Run Artifact
      # =========================================

      - name: Restore Previous Files
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-persistent-files
          path: C:\PersistentFiles
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      # =========================================
      # 2. Enable RDP
      # =========================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      # =========================================
      # 3. Create Admin Account
      # =========================================

      - name: Create Admin Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "CynetAdmin" `
            -ErrorAction SilentlyContinue)) {

            New-LocalUser `
              -Name "CynetAdmin" `
              -Password $Password `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

      # =========================================
      # 4. Install Tailscale
      # =========================================

      - name: Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 8

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 5

          $IP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "RDP IP: $IP"
          Write-Host "Username: CynetAdmin"

      # =========================================
      # 5. Keep Runner Alive
      # =========================================

      - name: Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 330; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/330] Server running..."
          }

      # =========================================
      # 6. Prepare Backup
      # =========================================

      - name: Prepare Backup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $SavePath = "C:\PersistentFiles"
          $Profile = "$SavePath\Profile"

          New-Item -ItemType Directory `
            -Path $Profile -Force | Out-Null

          $Folders = @(
            "Desktop",
            "Documents",
            "Downloads"
          )

          foreach ($Folder in $Folders) {

            $Source = "C:\Users\runneradmin\$Folder"
            $Target = "$Profile\$Folder"

            New-Item -ItemType Directory `
              -Path $Target -Force | Out-Null

            if (Test-Path $Source) {

              robocopy $Source $Target /E /R:1 /W:1 /NFL /NDL /NJH /NJS

              if ($LASTEXITCODE -ge 8) {
                Write-Warning "Copy issue in $Folder"
              }
            }
          }

          # WinGet export - noninteractive

          try {

            $Winget = Get-Command winget.exe `
              -ErrorAction SilentlyContinue

            if ($Winget) {

              $env:WINGET_DISABLE_INTERACTIVITY = "1"

              & winget export `
                --output "$SavePath\packages.json" `
                --include-versions `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "WinGet export failed."
              }
            }

          } catch {
            Write-Warning "WinGet error: $_"
          }

          if (-not (Test-Path "$SavePath\packages.json")) {
            '{"Sources":[]}' |
              Set-Content "$SavePath\packages.json"
          }

          @{
            SavedAt = (Get-Date).ToUniversalTime().ToString("o")
            Machine = "Windows GitHub Runner"
            Folders = $Folders
          } | ConvertTo-Json -Depth 5 |
            Set-Content "$SavePath\backup-info.json"

          Write-Host "Backup prepared."

      # =========================================
      # 7. Upload Artifact
      # =========================================

      - name: Upload Persistent Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-persistent-files
          path: C:\PersistentFiles
          retention-days: 90
          compression-level: 6
          overwrite: true
          if-no-files-found: warn

      # =========================================
      # 8. Finish
      # =========================================

      - name: Done
        if: always()
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "WINDOWS BACKUP FINISHED"
          Write-Host "================================"
