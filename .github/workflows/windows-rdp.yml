name: Windows Cloud RDP - Persistent VPS

on:
  workflow_dispatch:

jobs:
  build:
    # IMPORTANT:
    # Use a real Windows VPS configured as a GitHub self-hosted runner.
    # "windows-latest" is an ephemeral GitHub-hosted VM; its files are not
    # guaranteed to survive after the workflow ends.
    runs-on: [self-hosted, windows]
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 0

      - name: 2. Create Admin Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Add RDP_PASSWORD to GitHub Actions secrets before running this workflow.'
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name 'CynetAdmin' -Password $Password `
            -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member 'CynetAdmin' `
            -ErrorAction SilentlyContinue

      - name: 3. Install & Connect Tailscale VPN
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw 'Add TAILSCALE_AUTHKEY to GitHub Actions secrets before running this workflow.'
          }

          $installer = 'C:\tailscale.msi'
          Invoke-WebRequest `
            'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $installer
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait

          Start-Sleep -Seconds 5
          & 'C:\Program Files\Tailscale\tailscale.exe' up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname='windows-persistent-rdp'

          Start-Sleep -Seconds 8
          $ts_ip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4).Trim()

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host '  >>> RDP SERVER IS READY! <<<' -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host '  Username     : CynetAdmin' -ForegroundColor Yellow
          Write-Host '  Password     : use the RDP_PASSWORD secret' -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host '==================================================' -ForegroundColor Green

      - name: 4. Schedule a restart after 6 hours
        shell: powershell
        run: |
          # This only restarts Windows. It does not delete files.
          # Files saved on the VPS persistent disk (for example C:\RDPData)
          # remain available after the restart.
          $taskName = 'Restart-Windows-VPS-after-6-hours'
          $restartAt = (Get-Date).AddHours(6)

          $action = New-ScheduledTaskAction `
            -Execute "$env:SystemRoot\System32\shutdown.exe" `
            -Argument '/r /f /t 60 /d p:0:0 /c "Scheduled restart after 6 hours"'
          $trigger = New-ScheduledTaskTrigger -Once -At $restartAt

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -User 'SYSTEM' `
            -RunLevel Highest `
            -Force

          Write-Host "Windows restart scheduled for $restartAt"

      - name: 5. Keep workflow alive until the restart window
        shell: powershell
        run: |
          # The restart task is independent of this loop. No cleanup is run.
          $end = (Get-Date).AddHours(6)
          while ((Get-Date) -lt $end) {
            $remaining = $end - (Get-Date)
            Write-Host ("VPS running. Remaining: {0:hh\:mm\:ss}" -f $remaining)
            Start-Sleep -Seconds 60
          }
